# NOT CANONICAL — use ../docker-compose.yml
version: '3.8'

x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100m

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./.env.judge0:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./.env.judge0:/judge0.conf:ro
    <<: *default-logging
    restart: always

  db:
    image: postgres:13.0
    env_file: .env.judge0
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:6.0
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: .env.judge0
    volumes:
      - redis-data:/data/
    <<: *default-logging
    restart: always

volumes:
  postgres-data:
  redis-data:
