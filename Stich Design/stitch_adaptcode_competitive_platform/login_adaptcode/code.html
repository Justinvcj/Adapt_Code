<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - AdaptCode</title>

                            "hard": "#FF375F",
                            "outline": "#a18d7a",
                            "background": "#111125",
                            "surface-container": "#1e1e32",
                            "surface": "#111125",
                            "medium": "#FFC01E",
                            "tertiary-fixed": "#c0e8ff",
                            "surface-dim": "#111125",
                            "on-secondary": "#002e6b",
                            "on-error": "#690005",
                            "inverse-primary": "#875200",
                            "surface-container-highest": "#333348",

                            "on-secondary-fixed-variant": "#004397",

                    },
                    "borderRadius": {
                            "DEFAULT": "0.125rem",

<style>
        body { background-color: #111125; }
        .input-glow:focus { box-shadow: 0 0 0 2px rgba(91, 141, 239, 0.2); border-color: #5B8DEF; }
    </style>
</head>
<body class="bg-background text-text-primary min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md">
<!-- Login Card Level 1 Elevation -->
<div class="w-full max-w-md bg-surface-elevated border border-border-default rounded-xl p-xl shadow-2xl backdrop-blur-md relative overflow-hidden">
<!-- Subtle Glow Effect -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header -->
<div class="text-center mb-xl">
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm tracking-tight">AdaptCode</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue solving problems.</p>
</div>
<!-- Form -->
<form class="space-y-md">
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="email">Email / Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" style="font-size: 18px;">person</span>
<input class="w-full bg-surface-elevated border border-border-default rounded text-text-primary placeholder-on-surface-variant/50 pl-lg py-sm font-body-md text-body-md focus:outline-none input-glow transition-all" id="email" placeholder="Enter your email" type="text"/>
</div>
</div>
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-xs" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 transform -translate-y-1/2 text-on-surface-variant" style="font-size: 18px;">lock</span>
<input class="w-full bg-surface-elevated border border-border-default rounded text-text-primary placeholder-on-surface-variant/50 pl-lg py-sm font-body-md text-body-md focus:outline-none input-glow transition-all" id="password" placeholder="Enter password" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-sm">
<label class="flex items-center space-x-xs cursor-pointer group">
<input class="form-checkbox bg-surface-elevated border-border-default rounded text-primary-container focus:ring-primary-container focus:ring-offset-surface-elevated focus:ring-offset-2" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface-variant group-hover:text-text-primary transition-colors">Remember me</span>
</label>
<a class="font-body-md text-body-md text-primary-container hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<button class="w-full bg-success text-surface-container-lowest font-headline-sm text-headline-sm py-sm rounded hover:bg-opacity-90 transition-all mt-lg font-bold" type="submit">
                Sign In
            </button>
</form>
<div class="mt-lg relative flex items-center justify-center">
<hr class="w-full border-border-default absolute"/>
<span class="bg-surface-elevated px-sm font-label-bold text-label-bold text-on-surface-variant relative z-10 uppercase tracking-widest">or continue with</span>
</div>
<!-- Social Logins -->
<div class="mt-lg flex space-x-md">
<button class="flex-1 flex items-center justify-center space-x-sm bg-surface-elevated border border-border-default py-sm rounded hover:border-border-hover hover:bg-surface-secondary transition-all group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-text-primary transition-colors" data-weight="fill">language</span>
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-text-primary transition-colors">Google</span>
</button>
<button class="flex-1 flex items-center justify-center space-x-sm bg-surface-elevated border border-border-default py-sm rounded hover:border-border-hover hover:bg-surface-secondary transition-all group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-text-primary transition-colors" data-weight="fill">code</span>
<span class="font-label-bold text-label-bold text-on-surface-variant group-hover:text-text-primary transition-colors">GitHub</span>
</button>
</div>
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Don't have an account? <a class="text-primary-container hover:text-primary transition-colors font-bold" href="#">Sign up free</a></p>
</div>
</div>
</body></html>
