<title>AdaptCode</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#1a1a2e;--bg-el:#282a36;--bg-sf:#303240;--bg-hover:rgba(255,255,255,.06);--bg-active:rgba(255,255,255,.1);
  --border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.16);
  --tx:#eff1f6;--tx-1:rgba(239,241,246,.7);--tx-2:rgba(239,241,246,.4);--tx-3:rgba(239,241,246,.2);
  --easy:#00b8a3;--med:#ffc01e;--hard:#ff375f;--solved:#2cbb5d;--premium:#ffa116;--blue:#5b8def;
  --easy-bg:rgba(0,184,163,.12);--med-bg:rgba(255,192,30,.12);--hard-bg:rgba(255,55,95,.12);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'Fira Code','Cascadia Code',monospace;
  --nav-h:50px;--side-w:220px;
  --r:4px;--r-md:8px;--r-lg:12px;--r-full:9999px;
  --t:.15s;--t2:.25s;
}
html{-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);overflow-x:hidden;min-height:100vh}
::selection{background:rgba(91,141,239,.3)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit;background:none;border:none;outline:none}
ul,ol{list-style:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ══ NAVBAR ══ */
.nav{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 16px;background:rgba(26,26,46,.85);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;width:100%;gap:4px}
.nav-brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:16px;cursor:pointer;flex-shrink:0;letter-spacing:-.02em}
.nav-brand .logo{width:28px;height:28px;border-radius:6px;background:var(--premium);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1a1a2e;font-family:var(--mono)}
.nav-links{display:flex;gap:2px;flex:1}
.nav-link{padding:6px 12px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--tx-1);transition:color var(--t);white-space:nowrap}
.nav-link:hover{color:var(--tx)}
.nav-link.act{color:var(--tx)}
.nav-link .chev{font-size:10px;margin-left:2px;opacity:.5}
.nav-link.store-link{color:var(--premium)}
.nav-link.store-link:hover{color:#ffb84d}
.nav-acts{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-search{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--tx-2);font-size:13px;cursor:pointer;transition:all var(--t);min-width:160px}
.nav-search:hover{background:rgba(255,255,255,.08);border-color:var(--border-h)}
.nav-search svg{width:14px;height:14px;flex-shrink:0}
.ni{width:34px;height:34px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--tx-2);transition:all var(--t);position:relative;font-size:13px}
.ni:hover{background:var(--bg-hover);color:var(--tx)}
.ni svg{width:18px;height:18px}
.ni .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--premium)}
.premium-badge{padding:4px 12px;border-radius:var(--r-full);border:1px solid var(--premium);color:var(--premium);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--t)}
.premium-badge:hover{background:rgba(255,161,22,.1)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#06d6a0,#0ab4e0);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#1a1a2e;cursor:pointer;flex-shrink:0}

/* Dropdown */
.dd{position:relative;display:inline-flex}
.dd-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:var(--bg-el);border:1px solid var(--border-h);border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(0,0,0,.5);padding:6px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:all var(--t2);z-index:200}
.dd.open .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-head{padding:12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:4px}
.dd-avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#06d6a0,#0ab4e0);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#1a1a2e;flex-shrink:0}
.dd-name{font-weight:600;font-size:14px}
.dd-upsell{font-size:12px;color:var(--premium)}
.dd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;border-bottom:1px solid var(--border);margin-bottom:4px}
.dd-grid-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--r-md);cursor:pointer;transition:background var(--t);font-size:11px;color:var(--tx-2)}
.dd-grid-item:hover{background:var(--bg-hover)}
.dd-grid-icon{width:32px;height:32px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:16px}
.dd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);font-size:13px;color:var(--tx-1);cursor:pointer;transition:all var(--t);width:100%}
.dd-item:hover{background:var(--bg-hover);color:var(--tx)}
.dd-item svg{width:16px;height:16px;color:var(--tx-2);flex-shrink:0}
.dd-sep{height:1px;background:var(--border);margin:4px 6px}
.dd-item.danger:hover{color:var(--hard)}

/* ══ LEFT SIDEBAR ══ */
.app-wrap{display:flex;height:calc(100vh - var(--nav-h))}
.sidebar{width:var(--side-w);flex-shrink:0;border-right:1px solid var(--border);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.si{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--tx-1);cursor:pointer;transition:all var(--t);white-space:nowrap}
.si:hover{background:var(--bg-hover);color:var(--tx)}
.si.act{color:var(--tx);background:var(--bg-hover)}
.si svg{width:18px;height:18px;flex-shrink:0;color:var(--tx-2)}
.si.act svg{color:var(--tx)}
.side-label{padding:8px 12px 4px;font-size:12px;font-weight:600;color:var(--tx-2);display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.side-label button{font-size:14px;color:var(--tx-2);cursor:pointer}
.side-sub{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 20px;border-radius:var(--r);font-size:13px;color:var(--tx-2);cursor:pointer;transition:all var(--t)}
.side-sub:hover{background:var(--bg-hover);color:var(--tx-1)}
.side-sub .ico{font-size:14px;width:20px;text-align:center}

/* ══ MAIN CONTENT ══ */
.main{flex:1;overflow-y:auto}
.main-inner{max-width:900px;margin:0 auto;padding:20px 24px}
.right-sb{width:300px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;padding:16px}

/* ══ BUTTONS ══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:500;transition:all var(--t);white-space:nowrap}
.btn-primary{background:var(--solved);color:#fff}
.btn-primary:hover{background:#34cc6a}
.btn-outline{border:1px solid var(--solved);color:var(--solved);background:transparent}
.btn-outline:hover{background:rgba(44,187,93,.1)}
.btn-ghost{color:var(--tx-2)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--tx)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-disconnect{padding:6px 16px;border-radius:var(--r);background:var(--bg-sf);color:var(--tx-1);font-size:13px;font-weight:500;border:1px solid var(--border);transition:all var(--t)}
.btn-disconnect:hover{background:var(--bg-hover);border-color:var(--border-h)}

/* ══ BADGES ══ */
.diff{display:inline-block;padding:2px 10px;border-radius:var(--r-full);font-size:12px;font-weight:500}
.diff-e{color:var(--easy);background:var(--easy-bg)}
.diff-m{color:var(--med);background:var(--med-bg)}
.diff-h{color:var(--hard);background:var(--hard-bg)}

/* ══ TABLE ══ */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:8px 12px;font-size:12px;font-weight:500;color:var(--tx-2);border-bottom:1px solid var(--border)}
.tbl td{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;color:var(--tx-1)}
.tbl tr:hover td{background:var(--bg-hover)}
.tbl .t-link{color:var(--tx);cursor:pointer;transition:color var(--t)}
.tbl .t-link:hover{color:var(--blue)}
.solved-icon{color:var(--solved);font-size:14px}
.attempted-icon{color:var(--med);font-size:14px}

/* ══ TABS ══ */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab{padding:10px 16px;font-size:13px;font-weight:500;color:var(--tx-2);cursor:pointer;transition:all var(--t);position:relative;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--tx-1)}
.tab.act{color:var(--tx)}
.tab.act::after{content:'';position:absolute;bottom:-1px;left:16px;right:16px;height:2px;background:var(--tx);border-radius:1px 1px 0 0}
.tab svg{width:14px;height:14px}

/* ══ SEARCH MODAL ══ */
.sm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:flex-start;justify-content:center;padding-top:120px}
.sm-overlay.open{display:flex}
.sm{width:90%;max-width:540px;background:var(--bg-el);border:1px solid var(--border-h);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden;animation:smIn .2s ease}
@keyframes smIn{from{opacity:0;transform:scale(.97) translateY(-8px)}to{opacity:1;transform:none}}
.sm-input{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sm-input svg{width:18px;height:18px;color:var(--tx-2);flex-shrink:0}
.sm-input input{flex:1;font-size:15px;color:var(--tx)}
.sm-input input::placeholder{color:var(--tx-3)}
.sm-results{padding:4px;max-height:340px;overflow-y:auto}
.sm-r{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:background var(--t);font-size:13px;color:var(--tx-1)}
.sm-r:hover,.sm-r.focused{background:var(--bg-hover);color:var(--tx)}
.sm-r .num{color:var(--tx-2);font-size:12px;width:28px;text-align:right;flex-shrink:0}
.sm-r .d{margin-left:auto;flex-shrink:0}
.sm-hint{padding:8px 14px;border-top:1px solid var(--border);display:flex;gap:16px;font-size:11px;color:var(--tx-3)}
.sm-hint kbd{font-size:10px;padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.06);border:1px solid var(--border)}

/* ══ TOAST ══ */
.toast-c{position:fixed;bottom:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:var(--r-md);background:var(--bg-el);border:1px solid var(--border-h);color:var(--tx);font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;align-items:center;gap:8px;animation:tIn .3s ease;max-width:360px}
.toast.out{animation:tOut .2s ease forwards}
.toast-i{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.toast-s .toast-i{background:rgba(44,187,93,.2);color:var(--solved)}
.toast-e .toast-i{background:var(--hard-bg);color:var(--hard)}
.toast-n .toast-i{background:rgba(91,141,239,.2);color:var(--blue)}
@keyframes tIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes tOut{to{opacity:0;transform:translateX(20px)}}

/* ══ HOME PAGE ══ */
.feed-item{padding:20px 0;border-bottom:1px solid var(--border)}
.feed-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.feed-head{display:flex;gap:12px;align-items:flex-start}
.feed-time{font-size:12px;color:var(--tx-2);margin-bottom:4px}
.feed-title{font-size:14px;color:var(--tx)}
.feed-link{color:var(--blue);cursor:pointer}
.feed-link:hover{text-decoration:underline}
.feed-body{font-size:13px;color:var(--tx-1);margin-top:6px;line-height:1.6}
.rsb-card{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.rsb-card h4{font-size:14px;font-weight:600;margin-bottom:8px}
.rsb-card p{font-size:13px;color:var(--tx-2);margin-bottom:12px}
.contest-item{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}
.contest-badge{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:22px}
.contest-info{flex:1}
.contest-info .ctime{font-size:12px;color:var(--tx-2)}
.contest-info .ctitle{font-size:14px;color:var(--tx)}

/* ══ PROBLEM SET PAGE ══ */
.tags-row{display:flex;gap:8px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--border)}
.tag-pill{padding:4px 10px;border-radius:var(--r-full);background:var(--bg-hover);font-size:12px;color:var(--tx-1);cursor:pointer;transition:all var(--t);white-space:nowrap}
.tag-pill:hover{background:var(--bg-active);color:var(--tx)}
.tag-pill .tc{color:var(--tx-2);margin-left:4px}
.cat-tabs{display:flex;gap:2px;padding:12px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.cat-tab{padding:6px 14px;border-radius:var(--r-full);font-size:13px;font-weight:500;color:var(--tx-2);cursor:pointer;transition:all var(--t);white-space:nowrap;border:1px solid transparent}
.cat-tab:hover{color:var(--tx-1)}
.cat-tab.act{background:var(--bg-el);color:var(--tx);border-color:var(--border)}
.ps-toolbar{display:flex;align-items:center;gap:8px;padding:12px 0}
.ps-search{flex:1;position:relative;max-width:300px}
.ps-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--tx-3)}
.ps-search input{width:100%;padding:7px 10px 7px 32px;border-radius:var(--r);border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:13px;transition:border-color var(--t)}
.ps-search input:focus{border-color:var(--blue)}
.ps-icons{display:flex;gap:2px}
.ps-icon{width:30px;height:30px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--tx-2);cursor:pointer;transition:all var(--t)}
.ps-icon:hover{background:var(--bg-hover);color:var(--tx)}
.ps-icon svg{width:16px;height:16px}
.ps-solved{font-size:13px;color:var(--tx-2);display:flex;align-items:center;gap:6px;margin-left:auto}
.freq-bar{width:50px;height:10px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;display:inline-block;vertical-align:middle}
.freq-fill{height:100%;background:var(--bg-sf);border-radius:2px}
.ps-pg{display:flex;justify-content:center;gap:2px;margin-top:16px}
.pg-b{min-width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--tx-2);cursor:pointer;transition:all var(--t)}
.pg-b:hover{background:var(--bg-hover);color:var(--tx)}
.pg-b.act{background:var(--bg-el);color:var(--tx)}

/* Calendar widget */
.cal-widget{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head .month{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.cal-head .badge-num{width:28px;height:28px;border-radius:50%;background:var(--premium);color:#1a1a2e;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.cal-head .badge-label{font-size:9px;text-transform:uppercase;color:var(--tx-2)}
.cal-arrows{display:flex;gap:4px}
.cal-arrows button{width:24px;height:24px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--tx-2);font-size:14px;transition:all var(--t)}
.cal-arrows button:hover{background:var(--bg-hover)}
.cal-grid-w{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal-grid-w .day-h{color:var(--tx-3);font-size:11px;padding:4px 0}
.cal-grid-w .day{padding:6px 0;border-radius:var(--r);color:var(--tx-2);cursor:pointer;transition:all var(--t)}
.cal-grid-w .day:hover{background:var(--bg-hover)}
.cal-grid-w .day.today{background:var(--premium);color:#1a1a2e;font-weight:600;border-radius:50%}
.weekly-card{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;margin-top:12px}
.weekly-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.weekly-head h5{font-size:13px;font-weight:600;color:var(--hard)}
.weekly-head span{font-size:11px;color:var(--tx-2)}
.weekly-boxes{display:flex;gap:4px;margin-bottom:10px}
.weekly-box{flex:1;padding:6px;border-radius:var(--r);background:var(--bg-sf);text-align:center;font-size:12px;font-weight:600;color:var(--tx-2);cursor:pointer}
.weekly-box.act{background:var(--premium);color:#1a1a2e}
.trending-card{background:var(--bg-el);border:1px solid var(--border);border-radius:var(--r-lg);padding:12px;margin-top:12px}
.trending-card h5{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.trending-search{width:100%;padding:7px 10px;border-radius:var(--r);border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:12px}

/* ══ PROBLEM PAGE ══ */
.prob-nav{display:flex;align-items:center;height:var(--nav-h);padding:0 12px;background:var(--bg-el);border-bottom:1px solid var(--border);gap:4px}
.prob-nav .logo{width:28px;height:28px;border-radius:6px;background:var(--premium);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#1a1a2e;font-family:var(--mono);cursor:pointer}
.pn-item{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:var(--r);font-size:13px;color:var(--tx-1);cursor:pointer;transition:all var(--t)}
.pn-item:hover{background:var(--bg-hover);color:var(--tx)}
.pn-item svg{width:16px;height:16px}
.pn-sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.pn-right{margin-left:auto;display:flex;align-items:center;gap:4px}
.pn-run{padding:6px 14px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--tx);background:var(--bg-sf);display:flex;align-items:center;gap:6px;transition:all var(--t)}
.pn-run:hover{background:rgba(255,255,255,.12)}
.pn-submit{padding:6px 14px;border-radius:var(--r);font-size:13px;font-weight:600;color:#fff;background:var(--solved);display:flex;align-items:center;gap:6px;transition:all var(--t)}
.pn-submit:hover{background:#34cc6a}
.pn-submit svg{width:14px;height:14px}
.pn-icon{width:32px;height:32px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--tx-2);transition:all var(--t)}
.pn-icon:hover{background:var(--bg-hover);color:var(--tx)}
.pn-icon svg{width:16px;height:16px}

.prob{display:flex;height:calc(100vh - var(--nav-h));overflow:hidden}
.prob-l{width:50%;min-width:320px;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
.prob-l-body{flex:1;overflow-y:auto;padding:16px 20px}
.prob-div{width:4px;flex-shrink:0;cursor:col-resize;background:transparent;transition:background var(--t);position:relative}
.prob-div:hover,.prob-div.active{background:var(--blue)}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function highlight(code,lang){
  let h=esc(code);
  h=h.replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|&quot;&quot;&quot;[\s\S]*?&quot;&quot;&quot;)/g,'<span class="hl-str">$1</span>');
  h=h.replace(/(&quot;.*?&quot;|'(?:[^'\\]|\\.)*')/g,'<span class="hl-str">$1</span>');
  if(lang==='python3')h=h.replace(/(#[^\n]*)/g,'<span class="hl-cm">$1</span>');
  else{h=h.replace(/(\/\/[^\n]*)/g,'<span class="hl-cm">$1</span>');h=h.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="hl-cm">$1</span>')}
  let kws;
  if(lang==='python3')kws='class|def|return|if|else|elif|for|in|while|and|or|not|True|False|None|self|pass|import|from|as|with|try|except|raise|lambda';
  else if(lang==='javascript')kws='var|let|const|function|return|if|else|for|while|do|new|this|typeof|true|false|null|undefined|class|of|in';
  else if(lang==='java')kws='class|public|private|protected|static|final|void|int|long|double|float|boolean|char|return|if|else|for|while|new|this|null|true|false';
  else kws='class|public|private|void|int|long|double|float|bool|char|return|if|else|for|while|new|this|namespace|using|include|const|auto|nullptr';
  h=h.replace(new RegExp('\\b('+kws+')\\b','g'),'<span class="hl-kw">$1</span>');
  h=h.replace(/\b(self|this)\b/g,'<span class="hl-self">$1</span>');
  let bis;
  if(lang==='python3')bis='print|len|range|int|str|list|dict|set|enumerate|zip|map|filter|sorted|min|max|sum|List';
  else if(lang==='javascript')bis='console|log|Map|Set|Array|Object|String|Number|Promise|Math|JSON';
  else if(lang==='java')bis='System|String|Integer|Map|HashMap|List|ArrayList|Arrays|Math';
  else bis='vector|string|unordered_map|map|set|pair|queue|stack|sort|cout|cin|size|count';
  h=h.replace(new RegExp('\\b('+bis+')\\b','g'),'<span class="hl-bi">$1</span>');
  h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="hl-num">$1</span>');
  h=h.replace(/(def |function |\.)(\w+)(\s*\()/g,'$1<span class="hl-fn">$2</span>$3');
  return h;
}

function toast(msg,type='n'){
  const c=document.getElementById('toasts'),el=document.createElement('div');
  const icons={s:'✓',e:'✕',n:'i'};
  el.className='toast toast-'+type;
  el.innerHTML=`<span class="toast-i">${icons[type]||'i'}</span>${esc(msg)}`;
  c.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),200)},3000);
}

  const el=document.getElementById(id);if(!el)return;
  const open=el.classList.toggle('open');

}

}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSM();return}
  const m=document.getElementById('searchModal');if(!m.classList.contains('open'))return;
  if(e.key==='Escape'){closeSM();return}
  const items=m.querySelectorAll('.sm-r');if(!items.length)return;
  if(e.key==='ArrowDown'){e.preventDefault();sFocus=Math.min(sFocus+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('focused',i===sFocus))}
  if(e.key==='ArrowUp'){e.preventDefault();sFocus=Math.max(sFocus-1,0);items.forEach((el,i)=>el.classList.toggle('focused',i===sFocus))}
  if(e.key==='Enter'&&sFocus>=0)items[sFocus].click();
});
document.getElementById('smInput').addEventListener('input',function(){updateSM(this.value)});
document.getElementById('searchModal').addEventListener('click',function(e){if(e.target===this)closeSM()});

function buildCal(){
  const now=new Date();const m=now.toLocaleString('en',{month:'long'});const y=now.getFullYear();
  const first=new Date(y,now.getMonth(),1);const days=new Date(y,now.getMonth()+1,0).getDate();
  const startDay=first.getDay();const today=now.getDate();
  const dayNames=['S','M','T','W','T','F','S'];
  let cells='';
  for(let i=0;i<dayNames.length;i++)cells+=`<div class="day-h">${dayNames[i]}</div>`;
  for(let i=0;i<startDay;i++)cells+=`<div class="day"></div>`;
  for(let d=1;d<=days;d++)cells+=`<div class="day ${d===today?'today':''}">${d}</div>`;
  const rem=(startDay+days)%7;if(rem)for(let i=0;i<7-rem;i++)cells+=`<div class="day"></div>`;
  return `<div class="cal-widget"><div class="cal-head"><div class="month">Day ${today} <span style="font-size:12px;color:var(--tx-2)">${Math.ceil((new Date(y,11,31)-now)/(1000*60*60*24))} left</span></div><div style="display:flex;align-items:center;gap:8px"><div style="text-align:center"><div class="badge-num" style="font-size:9px">${now.toLocaleString('en',{month:'short'}).toUpperCase()}</div></div><div class="cal-arrows"><button>‹</button><button>›</button></div></div></div><div class="cal-grid-w">${cells}</div></div>`;
}

    <div class="set-nav"><h2>Settings</h2>${tabs.map(([k,l])=>`<a class="set-link ${ST.setTab===k?'act':''}" href="#" onclick="event.preventDefault();ST.setTab='${k}';render()">${l}${k==='profile'?' ↗':''}</a>`).join('')}</div>
    <div class="set-body">
      ${ST.setTab==='account'?`
      <h3>General</h3>

      <div class="set-row"><div class="set-row-icon">${IC.mail}</div><div><div class="set-row-label">Email</div></div><div class="set-row-val">23c****@drngpit.ac.in</div><div class="set-row-arrow">›</div></div>
      <div class="set-row"><div class="set-row-icon">${IC.phone}</div><div><div class="set-row-label">Phone Number</div></div><div class="set-row-val"></div><div class="set-row-arrow">›</div></div>
      <div class="set-row"><div class="set-row-icon">${IC.key}</div><div><div class="set-row-label">Password</div></div><div class="set-row-val">••••••••</div><div class="set-row-arrow">›</div></div>
      <div class="set-section"><h4>Social Accounts</h4><p class="set-sub">Connect a social account to sign in to AdaptCode.</p>
        <div class="social-row"><div class="social-row-icon">${IC.google}</div><div class="social-row-name">Google</div><button class="btn-disconnect" onclick="toast('Disconnect — demo','n')">Disconnect</button></div>
        <div class="social-row"><div class="social-row-icon">${IC.github}</div><div class="social-row-name">Github</div><button class="btn-disconnect" onclick="toast('Disconnect — demo','n')">Disconnect</button></div>
      </div>

function runCode(){ST.cTab='result';render();const b=document.getElementById('conBody');if(b)b.innerHTML='<div style="color:var(--tx-2)">Running...</div>';setTimeout(()=>{if(b)b.innerHTML=`<div style="color:var(--solved);font-weight:600;margin-bottom:8px">✓ All test cases passed</div><div class="cl">Input</div><div class="cv">nums = [2, 7, 11, 15], target = 9</div><div class="cl">Output</div><div class="cv" style="color:var(--tx)">[0, 1]</div><div class="cl">Expected</div><div class="cv" style="color:var(--tx)">[0, 1]</div>`;toast('All test cases passed','s')},800)}

function submitCode(){toast('Submitting...','n');setTimeout(()=>toast('Accepted — 3ms runtime, beats 94.7%','s'),1400)}

function genHeatmap(){
  const g=document.getElementById('hmGrid');if(!g)return;
  let s=42;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
  let h='';for(let w=0;w<52;w++){h+='<div class="hm-week">';for(let d=0;d<7;d++){const v=r();let l=0;if(v>.88)l=4;else if(v>.74)l=3;else if(v>.58)l=2;else if(v>.4)l=1;h+=`<div class="hm-cell h${l}"></div>`}h+='</div>'}g.innerHTML=h;
}

function initSplit(){
  const div=document.getElementById('pDiv'),L=document.getElementById('pL'),R=document.getElementById('pR');if(!div||!L||!R)return;
  let on=false;
  div.addEventListener('mousedown',e=>{on=true;div.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault()});
  document.addEventListener('mousemove',e=>{if(!on)return;const b=L.parentElement.getBoundingClientRect();const p=((e.clientX-b.left)/b.width)*100;const c=Math.max(25,Math.min(75,p));L.style.width=c+'%';R.style.flex='none';R.style.width=(100-c-.3)+'%'});
  document.addEventListener('mouseup',()=>{if(on){on=false;div.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect=''}});
}

function initEditor(){
  const ta=document.getElementById('edTA'),hl=document.getElementById('edHL'),ln=document.getElementById('lineNums');if(!ta||!hl||!ln)return;
  function sync(){hl.innerHTML=highlight(ta.value,ST.lang);ln.innerHTML=Array.from({length:ta.value.split('\n').length},(_,i)=>`<span>${i+1}</span>`).join('')}
  ta.addEventListener('input',sync);
  ta.addEventListener('scroll',()=>{hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;ln.scrollTop=ta.scrollTop});
  ta.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart,end=ta.selectionEnd;ta.value=ta.value.substring(0,s)+'    '+ta.value.substring(end);ta.selectionStart=ta.selectionEnd=s+4;sync()}});
}

function render(){
  const hash=location.hash.slice(1)||'/';const app=document.getElementById('app');
  if(hash==='/'||hash==='/home')app.innerHTML=pageHome();
  else if(hash==='/login')app.innerHTML=pageLogin();
  else if(hash==='/problems')app.innerHTML=pageProblemSet();
  else if(hash.startsWith('/problem/'))app.innerHTML=pageProblem(hash.replace('/problem/',''));
  else if(hash.startsWith('/profile/'))app.innerHTML=pageProfile();
  else if(hash==='/settings')app.innerHTML=pageSettings();
  else app.innerHTML=`${mkNav('')}<div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - var(--nav-h));flex-direction:column;gap:12px"><h2>404</h2><p style="color:var(--tx-2)">Page not found</p><a class="btn btn-outline" href="#/">Go Home</a></div>`;
  genHeatmap();initSplit();initEditor();window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',render);
</script>
