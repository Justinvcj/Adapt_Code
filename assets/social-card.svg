<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0612"/>
      <stop offset="100%" stop-color="#140820"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="1">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="60%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="gridFade" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#000" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- glows -->
  <circle cx="200" cy="200" r="450" fill="url(#glowA)" filter="url(#soft)"/>
  <circle cx="1000" cy="500" r="400" fill="url(#glowB)" filter="url(#soft)"/>

  <!-- grid -->
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- logo: stylised A with the dot -->
  <g transform="translate(80, 68)">
    <!-- angled A stroke -->
    <path d="M 20 110 L 70 10 L 120 110 M 40 75 L 100 75"
          stroke="url(#aGrad)" stroke-width="18" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- side dot -->
    <ellipse cx="148" cy="80" rx="18" ry="24" fill="url(#dotGrad)"/>
  </g>

  <!-- wordmark -->
  <text x="270" y="155"
        font-family="-apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="76" font-weight="800" letter-spacing="-1.5"
        fill="url(#titleGrad)">AdaptCode</text>

  <!-- title -->
  <text x="80" y="330"
        font-family="-apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1" fill="#ffffff">
    An adaptive DS&amp;A tutor that
  </text>
  <text x="80" y="395"
        font-family="-apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-1" fill="#ffffff">
    <tspan fill="#c4b5fd">learns you</tspan> while you learn to code.
  </text>

  <!-- pills -->
  <g font-family="-apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
     font-size="20" font-weight="500" fill="#e9d5ff">
    <g transform="translate(80, 460)">
      <rect width="286" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="143" y="30" text-anchor="middle">Bayesian Knowledge Tracing</text>
    </g>
    <g transform="translate(386, 460)">
      <rect width="170" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="85" y="30" text-anchor="middle">LinUCB bandit</text>
    </g>
    <g transform="translate(576, 460)">
      <rect width="180" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="90" y="30" text-anchor="middle">Piston sandbox</text>
    </g>
    <g transform="translate(776, 460)">
      <rect width="240" height="46" rx="23" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="120" y="30" text-anchor="middle">Gemini post-mortems</text>
    </g>
  </g>

  <!-- footer -->
  <text x="80" y="580"
        font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace"
        font-size="22" font-weight="600" fill="#a78bfa">
    adapt-code.vercel.app
  </text>
  <text x="1120" y="580"
        font-family="-apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif"
        font-size="18" font-weight="400" fill="rgba(255,255,255,0.55)"
        text-anchor="end">
    Next.js 14  ·  FastAPI  ·  Supabase  ·  Cloud Run
  </text>
</svg>
